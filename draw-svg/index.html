<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Art SVG Drawer — Felix' Workshop</title>
<meta name="description" content="Draw pixel art on a grid-snapped canvas, pick a classic sprite size or set your own, and export exactly what you drew as a real SVG file.">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=5">
<script src="../assets/preprint/js/mode.js"></script>
<link rel="stylesheet" href="../assets/preprint/styles.css">
<!-- core.css, which this page skipped while base.css was standing in for it. It
     is here for the marker: .mk--citron is one of the two ink families and the
     annotated half of "printed first, then annotated". base.css follows it and
     wins every tie. -->
<link rel="stylesheet" href="../assets/preprint/core.css">
<link rel="stylesheet" href="../assets/preprint/controls.css">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <a class="back-link" href="../">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" aria-hidden="true"><path d="M13.5 8h-10M7.5 4l-4 4 4 4"></path></svg>
        Felix' Workshop
      </a>
      <div class="title-row">
        <h1 class="tool-title">Pixel Art SVG Drawer</h1>
        <button class="share-btn" type="button" data-share data-tip="Copy a link to this tool, to hand it to somebody else">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" aria-hidden="true"><path d="M9.5 4.5h3v3M12.5 4.5 9 8M6.5 11.5h-3v-3M3.5 11.5 7 8"></path></svg>
          <span data-share-label>copy link</span>
        </button>
        <button class="share-btn pin-btn" type="button" data-pin="draw-svg" aria-label="Pin this tool to the top of the workshop"><span class="pin-head" aria-hidden="true"></span><span data-pin-label>pin</span></button>
      </div>
    </div>
    <button class="modeswitch" type="button" data-mode-toggle aria-label="Switch colour mode"><span class="modeswitch__box" aria-hidden="true"><span class="modeswitch__fill"></span></span><span class="sr-only">Switch between light and dark mode</span></button>
  </header>

  <div class="spine"></div>

  <div class="toolbar">
    <div class="group">
      <label for="width">Canvas (px)</label>
      <input class="field" type="number" id="width" min="1" max="4000" value="32" aria-label="Canvas width in pixels">
      <span class="dim-sep" aria-hidden="true">&times;</span>
      <input class="field" type="number" id="height" min="1" max="4000" value="32" aria-label="Canvas height in pixels">
      <button class="btn-ghost" id="resize">Set canvas</button>
    </div>
    <div class="group" id="presets">
      <label>Sizes</label>
      <button class="btn-ghost preset" type="button" data-w="8" data-h="8" data-tip="Tiny icon sprite">8&times;8</button>
      <button class="btn-ghost preset" type="button" data-w="16" data-h="16" data-tip="Classic sprite / favicon">16&times;16</button>
      <button class="btn-ghost preset" type="button" data-w="32" data-h="32" data-tip="Standard pixel-art sprite">32&times;32</button>
      <button class="btn-ghost preset" type="button" data-w="64" data-h="64" data-tip="Detailed sprite or tile sheet">64&times;64</button>
      <button class="btn-ghost preset" type="button" data-w="128" data-h="128" data-tip="Large sprite or small scene">128&times;128</button>
      <button class="btn-ghost preset" type="button" data-w="160" data-h="144" data-tip="Game Boy screen">160&times;144</button>
      <button class="btn-ghost preset" type="button" data-w="256" data-h="240" data-tip="NES screen">256&times;240</button>
    </div>
    <div class="group">
      <label for="color">Color</label>
      <input class="field swatch" type="color" id="color" value="#111111">
      <label for="stroke">Brush</label>
      <input type="range" id="stroke" min="1" max="40" value="1">
      <span class="tag readout" id="strokeValue">1px</span>
    </div>
    <div class="group">
      <button class="btn-ghost icon-only" id="zoomOut" aria-label="Zoom out">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" aria-hidden="true"><path d="M2.5 8h11"></path></svg>
      </button>
      <span class="tag readout" id="zoomValue">100%</span>
      <button class="btn-ghost icon-only" id="zoomIn" aria-label="Zoom in">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11"></path></svg>
      </button>
      <button class="btn-ghost" id="zoomFit">Fit</button>
      <label class="checkbox"><input type="checkbox" id="gridToggle"> Show pixel grid</label>
    </div>
    <div class="group">
      <button class="btn-ghost" id="clear">Clear</button>
      <button class="btn-primary" id="export">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" aria-hidden="true"><path d="M8 2.5v7.5M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11"></path></svg>
        Export SVG
      </button>
    </div>
  </div>

  <div id="canvasWrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
      <defs>
        <pattern id="pixelGrid" width="1" height="1" patternUnits="userSpaceOnUse">
          <path d="M 1 0 L 0 0 0 1" fill="none" stroke-width="0.07"></path>
        </pattern>
      </defs>
      <rect id="gridOverlay" x="0" y="0" width="100%" height="100%" fill="url(#pixelGrid)" pointer-events="none" style="display: none;"></rect>
    </svg>
  </div>
</div>

<script src="script.js"></script>
<script src="../assets/preprint/js/controls.js"></script>
<script src="../assets/share.js"></script>
<script src="../assets/favourites.js"></script>
</body>
</html>
