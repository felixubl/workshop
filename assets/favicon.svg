<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Felix' Workshop">
  <!-- The marker swipe: the masthead compressed to a tab. The homepage sets
       "Felix' [Workshop]" with a citron marker field pressed onto the second
       word, tilted off square, casting a hard ink offset. That gesture belongs
       to the workshop. The three off-register plates that used to sit here are
       PREPRINT's mark for itself, and the workshop uses the system rather than
       being it.

       Everything is flattened on purpose. The citron is the marker-citron
       token already composited over paper, because at 16px a translucent fill
       over its own cast turns to mud. The cast is a plain offset rect for the
       same reason: no filter survives this size. Both values track the
       light-mode tokens and do not follow data-mode, since a favicon has no
       page to inherit from, and the paper ground is what keeps it a printed
       thing. No token name is spelled out above: a CSS custom property starts
       with two hyphens, which is not legal inside an XML comment. -->
  <rect width="32" height="32" fill="#fbfbf9"/>
  <!-- Cast, field and letter tilt together as one lockup. Rotating only the
       field leaves the W standing upright on a leaning sheet, and the letter's
       right arm walks into the cast. -->
  <g transform="rotate(-3 16 16)">
    <rect x="5.5" y="9.5" width="24" height="15" fill="#171716"/>
    <rect x="3" y="7" width="24" height="15" fill="#e9f37b"/>
    <path d="M6.6 10.2 L9.8 18.4 L15 13 L20.2 18.4 L23.4 10.2" fill="none" stroke="#171716" stroke-width="3.1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="1.9"/>
  </g>
</svg>
