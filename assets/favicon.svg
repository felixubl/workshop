<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 19 19" width="19" height="19" role="img" aria-label="Felix' Workshop">
  <!-- The plate mark: three 13px squares, off register, multiplied together.
       No logo exists for this system and none should be drawn — this is the
       mark. The paper square underneath is what the plates print onto, so
       multiply has a ground to act on at favicon size. -->
  <rect width="19" height="19" fill="#fbfbf9"/>
  <g style="isolation:isolate">
    <rect x="0" y="0" width="13" height="13" fill="#01a368" style="mix-blend-mode:multiply"/>
    <rect x="6" y="2" width="13" height="13" fill="#ed0a3f" style="mix-blend-mode:multiply"/>
    <rect x="3" y="6" width="13" height="13" fill="#0066ff" style="mix-blend-mode:multiply"/>
  </g>
</svg>
