<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overprint — Felix' Workshop</title>
<meta name="description" content="Overlap coloured shapes and see how their colours mix.">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=5">
<script src="../assets/preprint/js/mode.js"></script>
<link rel="stylesheet" href="../assets/preprint/styles.css">
<link rel="stylesheet" href="../assets/preprint/core.css">
<link rel="stylesheet" href="../assets/preprint/controls.css">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <!-- The ceiling lamp, drawn in assets/site.css and swung by
       assets/lamp.js. The span is the fixture and hangs behind the page; the
       button is the switch and sits over the shade, and swings with it. The
       rose is the only part fixed to the ceiling: the flex turns under it, and
       the head — the shade and the light it throws — turns again where the flex
       ends, because a weight on a cord arrives after the cord does. -->
    <span class="lamp" aria-hidden="true">
      <span class="lamp__hang">
        <span class="lamp__flex"></span>
        <span class="lamp__head">
          <span class="lamp__beam"></span>
          <svg class="lamp__head-art" viewBox="-70 0 140 96" fill="none">
            <circle class="lamp__bulb" cx="0" cy="55" r="12"></circle>
            <g class="lamp__rig">
              <path class="lamp__cup" d="M-8 0H8V14H-8Z"></path>
              <path class="lamp__shade" d="M-10 14C-13 27 -38 39 -64 45H64C38 39 13 27 10 14Z"></path>
              <path class="lamp__rim" d="M-66 45H66"></path>
            </g>
            <g class="lamp__cage">
              <path d="M-17 46C-17 64 -10 76 0 76C10 76 17 64 17 46"></path>
              <path d="M0 46V76"></path>
              <path d="M-15.5 62Q0 66 15.5 62"></path>
            </g>
          </svg>
        </span>
      </span>
      <svg class="lamp__rose" viewBox="-30 0 60 20" fill="none">
        <path class="lamp__canopy" d="M-28 0H28V9H-28Z"></path>
        <g class="lamp__rig">
          <path class="lamp__grip" d="M-8 9H8L5 16H-5Z"></path>
        </g>
      </svg>
    </span>
    <button class="lamp-switch" type="button" data-mode-toggle aria-label="Switch colour mode"></button>

    <div>
      <a class="back-link" href="../">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" aria-hidden="true"><path d="M13.5 8h-10M7.5 4l-4 4 4 4"></path></svg>
        Felix' Workshop
      </a>
      <div class="title-row">
        <h1 class="tool-title">Overprint</h1>
        <button class="share-btn" type="button" data-share>
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" aria-hidden="true"><path d="M9.5 4.5h3v3M12.5 4.5 9 8M6.5 11.5h-3v-3M3.5 11.5 7 8"></path></svg>
          <span data-share-label>copy link</span>
        </button>
        <button class="share-btn pin-btn" type="button" data-pin="overprint" aria-label="Pin this tool"><span class="pin-head" aria-hidden="true"></span><span data-pin-label>pin</span></button>
      </div>
    </div>
  </header>

  <div class="spine"></div>

  <p class="lede">Overlap coloured shapes and see how their colours mix.</p>

  <div class="toolbar">
    <div class="group">
      <label for="sheetWidth">Sheet</label>
      <input class="field" type="number" id="sheetWidth" min="40" max="4000" value="640" aria-label="Sheet width">
      <span class="dim-sep" aria-hidden="true">&times;</span>
      <input class="field" type="number" id="sheetHeight" min="40" max="4000" value="480" aria-label="Sheet height">
      <button class="btn-ghost" id="setSheet">Set sheet</button>
    </div>
    <div class="group" id="sheetPresets">
      <label>Sizes</label>
      <button class="btn-ghost preset" type="button" data-w="640" data-h="480" data-tip="4:3">640&times;480</button>
      <button class="btn-ghost preset" type="button" data-w="800" data-h="800">800&times;800</button>
      <button class="btn-ghost preset" type="button" data-w="1200" data-h="675" data-tip="16:9">1200&times;675</button>
      <button class="btn-ghost preset" type="button" data-w="595" data-h="842" data-tip="A4 portrait">595&times;842</button>
      <button class="btn-ghost preset" type="button" data-w="842" data-h="595" data-tip="A4 landscape">842&times;595</button>
    </div>
    <div class="group">
      <label>Add</label>
      <button class="btn-ghost icon-only" type="button" data-add="square" aria-label="Add a square" data-tip="Square">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="miter" aria-hidden="true"><path d="M2.8 2.8h10.4v10.4H2.8Z"></path></svg>
      </button>
      <button class="btn-ghost icon-only" type="button" data-add="circle" aria-label="Add a circle" data-tip="Circle">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" aria-hidden="true"><circle cx="8" cy="8" r="5.4"></circle></svg>
      </button>
      <button class="btn-ghost icon-only" type="button" data-add="triangle" aria-label="Add a triangle" data-tip="Triangle">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="miter" aria-hidden="true"><path d="M8 2.4 13.6 13H2.4Z"></path></svg>
      </button>
      <button class="btn-ghost icon-only" type="button" data-add="hexagon" aria-label="Add a hexagon" data-tip="Hexagon">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="miter" aria-hidden="true"><path d="M8 2.2 13.2 5.1v5.8L8 13.8 2.8 10.9V5.1Z"></path></svg>
      </button>
    </div>

    <div class="group">
      <label>Mixing</label>
      <button class="btn-ghost preset is-active" type="button" data-model="ink" data-tip="Overlaps get darker">Ink</button>
      <button class="btn-ghost preset" type="button" data-model="light" data-tip="Overlaps get lighter">Light</button>
    </div>

    <div class="group" id="shapeGroup">
      <label for="shapeColor">Selected</label>
      <input class="field swatch" type="color" id="shapeColor" value="#00ffff" aria-label="Colour of the selected shape">
      <label for="shapeSize">Size</label>
      <input type="range" id="shapeSize" min="40" max="460" value="230" aria-label="Size of the selected shape">
      <span class="tag readout" id="sizeValue">230</span>
      <label for="shapeTurn">Turn</label>
      <input type="range" id="shapeTurn" min="0" max="359" value="0" aria-label="Rotation of the selected shape">
      <span class="tag readout" id="turnValue">0&deg;</span>
      <button class="btn-ghost" id="remove">Remove</button>
    </div>

    <!-- The workshop's own colours, offered as pigments. Faces and names are
       written by script.js, because the plates carry one value per ground and
       the ground here is the sheet's rather than the page's. -->
    <div class="group" id="paletteGroup">
      <label>Palette</label>
      <button class="pigment" type="button" data-pigment="plate-1"></button>
      <button class="pigment" type="button" data-pigment="plate-2"></button>
      <button class="pigment" type="button" data-pigment="plate-3"></button>
      <button class="pigment" type="button" data-pigment="marker-citron"></button>
      <button class="pigment" type="button" data-pigment="marker-pink"></button>
      <button class="pigment" type="button" data-pigment="marker-cyan"></button>
    </div>

    <div class="group">
      <button class="btn-ghost" id="clear">Clear</button>
      <button class="btn-primary" id="export">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" aria-hidden="true"><path d="M8 2.5v7.5M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11"></path></svg>
        Export SVG
      </button>
    </div>
  </div>

  <div id="canvasWrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-label="Empty sheet"></svg>
  </div>

  <p class="note">Drag a shape to move it. Arrow keys nudge it. Delete removes it.</p>
</div>

<script src="script.js"></script>
<script src="../assets/preprint/js/controls.js"></script>
<script src="../assets/lamp.js"></script>
<script src="../assets/share.js"></script>
<script src="../assets/favourites.js"></script>
</body>
</html>
