<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>verify — the workshop</title>
<!-- The system's own conformance check, vendored. Loaded without data-layers so
     it defines preprintConformance() and waits to be called from the run below,
     rather than printing its own box. -->
<script src="/assets/preprint/tools/conformance.js"></script>
</head>
<body style="margin:0;font:13px ui-monospace,monospace">
<pre id="out">running…</pre>

<!-- The frames are the real pages. Every assertion below is one of the laws in
     PREPRINT's guidelines/laws.md or one line of the migration brief's own
     "Done when" checklist, which is the closest thing this site has to a spec. -->
<iframe id="home"  src="/"                  style="width:1280px;height:900px;border:0"></iframe>
<iframe id="tool"  src="/draw-svg/"         style="width:1280px;height:900px;border:0"></iframe>
<iframe id="meta"  src="/metadata-cleaner/" style="width:1280px;height:900px;border:0"></iframe>
<iframe id="rand"  src="/random-numbers/"   style="width:1280px;height:900px;border:0"></iframe>
<iframe id="pdft"  src="/pdf-toolkit/"      style="width:1280px;height:900px;border:0"></iframe>
<iframe id="narrow" src="/"                 style="width:390px;height:800px;border:0"></iframe>

<script>
var results = [];
function ok(name, cond, detail) {
  results.push((cond ? 'PASS  ' : 'FAIL  ') + name + (detail ? '  ::  ' + detail : ''));
  document.getElementById('out').textContent = results.join('\n');
}
window.onerror = function (m, s, l) { ok('uncaught ' + m + ' @' + l, false); };

function everyEl(d) { return Array.prototype.slice.call(d.querySelectorAll('*')); }

/* Every style rule a page carries, the workshop's own layers only. The DOM
   checks below see only what is on screen, and a tool's real state is often
   behind an interaction, so these read the stylesheets instead. A rule is
   wrong whether or not anything currently matches it. The vendored tree is
   skipped: it belongs to the system, and conformance.js already checks it. */
function ownRules(d) {
  var out = [];
  Array.prototype.slice.call(d.styleSheets).forEach(function (sheet) {
    var href = sheet.href || '';
    if (href.indexOf('/assets/preprint/') !== -1) return;
    var rules;
    try { rules = sheet.cssRules; } catch (e) { return; }   // cross-origin
    (function walk(list) {
      Array.prototype.slice.call(list).forEach(function (r) {
        /* Collect first, then descend; the two are not exclusive. Chrome gives
           every CSSStyleRule a .cssRules, empty unless the rule contains
           nested CSS, so an early return on r.cssRules collects nothing and
           the empty list passes every check below. */
        if (r.style) out.push({ sel: r.selectorText || '', style: r.style, href: href });
        if (r.cssRules && r.cssRules.length) walk(r.cssRules);   // @media, @supports, nesting
      });
    })(rules);
  });
  return out;
}

function run() {
  var H = document.getElementById('home'), hd = H.contentDocument, hw = H.contentWindow;
  var T = document.getElementById('tool'), td = T.contentDocument, tw = T.contentWindow;
  var M = document.getElementById('meta'), md = M.contentDocument, mw = M.contentWindow;
  var R = document.getElementById('rand'), rd = R.contentDocument, rw = R.contentWindow;
  var P = document.getElementById('pdft'), pd = P.contentDocument, pw = P.contentWindow;
  var N = document.getElementById('narrow'), nd = N.contentDocument, nw = N.contentWindow;

  var pages = [
    { n: 'index', d: hd, w: hw }, { n: 'draw-svg', d: td, w: tw },
    { n: 'metadata-cleaner', d: md, w: mw }, { n: 'random-numbers', d: rd, w: rw },
    { n: 'pdf-toolkit', d: pd, w: pw }
  ];

  /* ── the faces ─────────────────────────────────────────────────────────── */
  // A face that failed to load falls back and the family string still reads
  // right, so measure the rendered advance rather than trusting the name.
  function loaded(d, w, family) {
    var a = d.createElement('span'), b = d.createElement('span');
    a.textContent = b.textContent = 'HHHHHHHHHHHH';
    a.style.cssText = 'position:absolute;visibility:hidden;font-size:40px;font-family:' + family;
    b.style.cssText = 'position:absolute;visibility:hidden;font-size:40px;font-family:monospace';
    d.body.appendChild(a); d.body.appendChild(b);
    var differs = Math.abs(a.offsetWidth - b.offsetWidth) > 1;
    d.body.removeChild(a); d.body.removeChild(b);
    return differs;
  }
  ok('display face Hepta Slab really loaded', loaded(hd, hw, "'Hepta Slab'"));
  ok('body face Zilla Slab really loaded', loaded(hd, hw, "'Zilla Slab'"));
  /* Cousine is metrically compatible with Courier New, so measuring it against
     generic monospace proves nothing. Ask the font loader instead. */
  ok('mono face Cousine really loaded', hd.fonts.check("12px 'Cousine'"));

  /* Body copy is Zilla Slab, not mono. Built rather than found: there is no
     prose left on these pages to measure, so this asserts what body copy is
     set in when it exists. */
  var host = hd.querySelector('.tool-card') || hd.body;
  var probe = hd.createElement('p');
  probe.textContent = 'The quick brown fox';
  probe.style.cssText = 'position:absolute;visibility:hidden';
  host.appendChild(probe);
  var f = hw.getComputedStyle(probe).fontFamily;
  probe.remove();
  ok('prose is set in Zilla Slab, not mono', /Zilla Slab/.test(f), f);

  /* ── the cut scale, and what may be round ──────────────────────────────── */
  // Pill belongs to tags and badges and nothing else.
  pages.forEach(function (p) {
    var round = everyEl(p.d).filter(function (el) {
      var r = p.w.getComputedStyle(el).borderRadius;
      if (!/9999px|50%/.test(r)) return false;
      /* A tag may be a pill; a control may not, whatever it is named. Testing
         the class name alone let .seed-tag, a button with a click handler,
         pass by being named after a tag. */
      if (el.tagName === 'BUTTON' || el.tagName === 'A' || el.tagName === 'INPUT' ||
          el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') return true;
      return !/\b(tag|badge|pill|badge-live|badge-soon)\b/.test(el.className || '');
    });
    ok('[' + p.n + '] no pill radius outside tags and badges', round.length === 0,
       round.length ? round.length + ' offenders, first: ' + round[0].tagName + '.' + round[0].className : '');
  });

  /* ── shadows are plates printed off register, never soft ───────────────── */
  pages.forEach(function (p) {
    var soft = everyEl(p.d).filter(function (el) {
      var s = p.w.getComputedStyle(el).boxShadow;
      if (!s || s === 'none') return false;
      // rgb(...) Xpx Ypx BLURpx  — the third length is the blur and must be 0
      var m = s.match(/(-?[\d.]+)px\s+(-?[\d.]+)px\s+([\d.]+)px/);
      return m && parseFloat(m[3]) !== 0;
    });
    ok('[' + p.n + '] every shadow is a hard offset, no blur', soft.length === 0,
       soft.length ? soft.length + ' soft, first: ' + soft[0].tagName + '.' + soft[0].className : '');
  });

  /* ── nothing below 11.2px ──────────────────────────────────────────────── */
  pages.forEach(function (p) {
    var tiny = everyEl(p.d).filter(function (el) {
      if (!el.textContent || !el.textContent.trim()) return false;
      if (!el.offsetWidth && !el.offsetHeight) return false;
      return parseFloat(p.w.getComputedStyle(el).fontSize) < 11.2;
    });
    ok('[' + p.n + '] nothing is set below 11.2px', tiny.length === 0,
       tiny.length ? tiny.length + ' too small, first: ' + tiny[0].tagName + '.' + tiny[0].className +
                     ' at ' + p.w.getComputedStyle(tiny[0]).fontSize : '');
  });

  /* ── exactly one 6px rule per page: the spine ──────────────────────────── */
  pages.forEach(function (p) {
    var six = everyEl(p.d).filter(function (el) {
      var cs = p.w.getComputedStyle(el);
      return ['borderTopWidth', 'borderBottomWidth', 'borderLeftWidth', 'borderRightWidth']
        .some(function (s) { return parseFloat(cs[s]) === 6; });
    });
    ok('[' + p.n + '] the 6px spine is spent exactly once', six.length <= 1,
       six.length + ' element(s) carry a 6px rule');
  });

  /* ── the same two rules, read off the stylesheets ──────────────────────── */
  /* First, that there is anything to read. The two checks below both pass on
     an empty rule list, so without this they report a clean sheet when they in
     fact failed to open one. */
  pages.forEach(function (p) {
    var n = ownRules(p.d).length;
    ok('[' + p.n + '] the stylesheets are readable at all', n > 20, n + ' rules read');
  });

  // Nothing below 11.2px, whether or not it is on screen right now.
  pages.forEach(function (p) {
    var small = [];
    ownRules(p.d).forEach(function (r) {
      var v = r.style.getPropertyValue('font-size').trim();
      if (!v || v.indexOf('var(') !== -1 || v.indexOf('clamp(') !== -1) return;
      var px = /^([\d.]+)px$/.test(v) ? parseFloat(v)
             : /^([\d.]+)rem$/.test(v) ? parseFloat(v) * 16 : null;
      if (px !== null && px < 11.2) small.push(r.sel + ' { font-size: ' + v + ' }');
    });
    ok('[' + p.n + '] no rule sets type below 11.2px', small.length === 0,
       small.length ? small.length + ' rule(s), first: ' + small[0] : 'none');
  });

  // The spine is 6px and a page gets one. Any other rule reaching for that
  // weight is spending a licence the page has already spent.
  pages.forEach(function (p) {
    var spines = [];
    ownRules(p.d).forEach(function (r) {
      ['border', 'border-top', 'border-bottom', 'border-left', 'border-right',
       'border-width', 'border-top-width', 'border-bottom-width',
       'border-left-width', 'border-right-width'].forEach(function (prop) {
        var v = r.style.getPropertyValue(prop);
        if (v && (/\b6px\b/.test(v) || v.indexOf('--pp-rule-spine') !== -1)) {
          spines.push(r.sel + ' { ' + prop + ': ' + v.trim() + ' }');
        }
      });
    });
    ok('[' + p.n + '] only one rule reaches for the 6px spine', spines.length <= 1,
       spines.length ? spines.join('  |  ') : 'none');
  });

  /* ── the variant layer stays a variant ─────────────────────────────────── */
  // site.css and base.css are the workshop's own. They may name their own --w-*
  // values and they may NOT restate the system's ground, ink or plates: forking
  // those is how a family stops looking related.
  //
  // This check used to be written out here. It is the system's now, in
  // assets/preprint/tools/conformance.js, vendored with everything else, because
  // a conformance check each site keeps its own copy of is a check that drifts
  // away from the rules it is meant to be enforcing. It also catches a third
  // thing this version never did: a --pp-* name the system does not define,
  // which is how --pp-screen-dot sat here for months looking official.
  preprintConformance({ layers: ['/assets/site.css', '/assets/base.css'] })
    .then(function (results) {
      results.forEach(function (r) { ok(r.name, r.pass, r.detail); });
      finish();
    });

  /* ── the mark, and the pointers ────────────────────────────────────────── */
  /* The workshop does not draw the system's three-plate mark; its wordmark is
     the mark, a stroked W in plate ink with four corner nails. Asserted as it
     is rather than as the system default, because this is a licensed variant. */
  var wm = hd.querySelector('.wordmark');
  ok('the wordmark is the workshop\'s mark', !!wm);
  if (wm) {
    ok('the W carries the plate stroke',
       !!wm.querySelector('.mark-w'),
       hw.getComputedStyle(wm.querySelector('.mark-w') || wm).webkitTextStrokeColor || '');
    ok('the signboard keeps its four nails',
       (wm.querySelectorAll('.nails i') || []).length === 4,
       wm.querySelectorAll('.nails i').length + ' nails');
  }

  /* Drawn pointers: arrow on the body, point on anything clickable. A class-
     level cursor: pointer silently outranks that wiring, so assert the token
     won. */
  var clickable = hd.querySelector('a[href], button');
  if (clickable) {
    var c = hw.getComputedStyle(clickable).cursor;
    ok('a clickable object takes the DRAWN pointer, not the stock hand',
       /url\(/.test(c), c);
  }

  /* ── the narrow width still holds ──────────────────────────────────────── */
  var nb = nd.body;
  ok('no horizontal overflow at 390px',
     nb.scrollWidth <= nb.clientWidth + 1,
     nb.scrollWidth + ' vs ' + nb.clientWidth);

  /* ── the plates ────────────────────────────────────────────────────────── */
  /* .tool-card until the index dropped the queued rows and renamed what was
     left. Both halves of the old pair passed on zero, so the rename left a
     check that could only fail and a check that could only pass. */
  var plates = hd.querySelectorAll('.plate');
  ok('the index lists its tools as plates', plates.length > 0, plates.length + ' plates');
  var live = hd.querySelectorAll('.plate-live').length;
  ok('every plate is a live one', live === plates.length && live > 0,
     live + ' live of ' + plates.length + ' total');
}

var done = false;
function finish() {
  if (done) return; done = true;
  var pass = results.filter(function (r) { return r.indexOf('PASS') === 0; }).length;
  var fail = results.length - pass;
  results.push('', pass + ' pass, ' + fail + ' fail');
  document.getElementById('out').textContent = results.join('\n');
}

window.addEventListener('load', function () { setTimeout(run, 2500); });
</script>
</body>
</html>
