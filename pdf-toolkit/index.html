<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Toolkit — Felix' Workshop</title>
<meta name="description" content="Merge, split, reorder, rotate and redact PDF pages.">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=5">
<script src="../assets/preprint/js/mode.js"></script>
<link rel="stylesheet" href="../assets/preprint/styles.css">
<!-- Loaded for the overlay: .scrim and .modal are core's. base.css follows it
     and remains this site's chrome, as the documented order intends. -->
<link rel="stylesheet" href="../assets/preprint/core.css">
<link rel="stylesheet" href="../assets/preprint/controls.css">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <!-- The ceiling lamp, drawn in assets/site.css and swung by
       assets/lamp.js. The span is the fixture and hangs behind the page; the
       button is the switch and sits over the shade, and swings with it. The
       rose is the only part fixed to the ceiling: the flex turns under it, and
       the head — the shade and the light it throws — turns again where the flex
       ends, because a weight on a cord arrives after the cord does. -->
    <span class="lamp" aria-hidden="true">
      <span class="lamp__hang">
        <span class="lamp__flex"></span>
        <span class="lamp__head">
          <span class="lamp__beam"></span>
          <svg class="lamp__head-art" viewBox="-70 0 140 96" fill="none">
            <circle class="lamp__bulb" cx="0" cy="70" r="13"></circle>
            <g class="lamp__rig">
              <path class="lamp__shade" d="M-16 0H16L62 62H-62Z"></path>
              <path class="lamp__rim" d="M-64 62H64"></path>
            </g>
          </svg>
        </span>
      </span>
      <svg class="lamp__rose" viewBox="-30 0 60 20" fill="none">
        <path class="lamp__canopy" d="M-28 0H28V9H-28Z"></path>
        <g class="lamp__rig">
          <path class="lamp__grip" d="M-8 9H8L5 16H-5Z"></path>
        </g>
      </svg>
    </span>
    <button class="lamp-switch" type="button" data-mode-toggle aria-label="Switch colour mode"></button>

    <div>
      <a class="back-link" href="../">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" aria-hidden="true"><path d="M13.5 8h-10M7.5 4l-4 4 4 4"></path></svg>
        Felix' Workshop
      </a>
      <div class="title-row">
        <h1 class="tool-title">PDF Toolkit</h1>
        <button class="share-btn" type="button" data-share>
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" aria-hidden="true"><path d="M9.5 4.5h3v3M12.5 4.5 9 8M6.5 11.5h-3v-3M3.5 11.5 7 8"></path></svg>
          <span data-share-label>copy link</span>
        </button>
        <button class="share-btn pin-btn" type="button" data-pin="pdf-toolkit" aria-label="Pin this tool"><span class="pin-head" aria-hidden="true"></span><span data-pin-label>pin</span></button>
      </div>
    </div>
  </header>

  <div class="spine"></div>

  <p class="lede">Merge, split, reorder, rotate and redact PDF pages.</p>

  <div class="dropzone" id="drop">
    <p><strong>Drop PDFs here</strong>, or <button class="btn-ghost" type="button" id="pick">choose files</button></p>
    <p class="sheet-note">Nothing is uploaded.</p>
    <input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
  </div>

  <p class="hint" id="loadNote" hidden></p>

  <div id="workspace" hidden>
    <div class="toolbar">
      <div class="group">
        <label for="range">Select pages</label>
        <input class="field" type="text" id="range" placeholder="1-3, 8, 12-" size="14">
      </div>
      <div class="group">
        <label>&nbsp;</label>
        <div class="btn-row">
          <button class="btn-ghost" type="button" id="selApply">Apply</button>
          <button class="btn-ghost" type="button" id="selAll">All</button>
          <button class="btn-ghost" type="button" id="selNone">None</button>
          <button class="btn-ghost" type="button" id="selInvert">Invert</button>
        </div>
      </div>
      <div class="group">
        <label>Turn selected</label>
        <div class="btn-row">
          <button class="btn-ghost" type="button" id="rotL">&#8630; Left</button>
          <button class="btn-ghost" type="button" id="rotR">&#8631; Right</button>
        </div>
      </div>
      <div class="group">
        <label>Order</label>
        <div class="btn-row">
          <button class="btn-ghost" type="button" id="moveUp">Earlier</button>
          <button class="btn-ghost" type="button" id="moveDown">Later</button>
          <button class="btn-ghost" type="button" id="reverse">Reverse</button>
        </div>
      </div>
      <div class="group">
        <label>Remove</label>
        <div class="btn-row">
          <button class="btn-ghost" type="button" id="del">Delete</button>
          <button class="btn-ghost" type="button" id="keepOnly">Keep only</button>
          <button class="btn-ghost" type="button" id="clearMarks" data-tip="Blackouts and highlights">Marks</button>
        </div>
      </div>
      <div class="group">
        <label>Step back</label>
        <div class="btn-row">
          <button class="btn-ghost" type="button" id="undo" data-tip="⌘Z" disabled>Undo</button>
          <button class="btn-ghost" type="button" id="reset">Start over</button>
        </div>
      </div>
    </div>

    <div class="result-bar">
      <span class="section-label">Pages</span>
      <div class="result-right">
        <button class="btn-ghost" type="button" id="view" data-tip="Black out and highlight here" disabled>View full size</button>
        <span class="tag" id="tally">nothing loaded</span>
      </div>
    </div>

    <div id="grid" class="page-grid"></div>

    <!-- What the loaded files say about whoever made them, and what of it the
         saved file will carry. Folded away by default: it is read before
         saving rather than while the pages are being sorted. -->
    <div class="result-bar">
      <span class="section-label">Metadata</span>
      <div class="result-right">
        <span class="tag" id="metaTally"></span>
        <button class="btn-ghost" type="button" id="metaToggle" aria-expanded="false" aria-controls="metaPanel">Show</button>
      </div>
    </div>

    <section id="metaPanel" hidden>
      <div class="toolbar meta-tools">
        <div class="group" id="metaFiles" hidden>
          <label>File</label>
          <div class="btn-row" id="metaFileRow"></div>
        </div>
        <div class="group">
          <label>Every field</label>
          <div class="btn-row">
            <button class="btn-ghost" type="button" id="metaCutAll">Remove all</button>
            <button class="btn-ghost" type="button" id="metaKeepAll">Keep all</button>
          </div>
        </div>
      </div>

      <div class="sheet sheet-meta">
        <div class="sheet-cap">
          <code id="metaCapName"></code>
          <code class="meta" id="metaCapNote"></code>
        </div>
        <div class="sheet-scroll">
          <table id="metaTable">
            <thead>
              <tr>
                <th class="col-keep" scope="col"><span class="th-keep">Keep</span></th>
                <th class="col-name" scope="col">Field</th>
                <th class="col-value" scope="col">Value</th>
                <th class="col-note" scope="col">Risk</th>
              </tr>
            </thead>
          </table>
        </div>
      </div>

      <p class="legend">
        <span class="tag is-marked mk--citron">identifying</span> names a person or machine.
        <span class="tag">telling</span> narrows it down. Rows without a switch are never saved.
      </p>
      <p class="sheet-note" id="metaNote"></p>
    </section>

    <div class="toolbar save-bar">
      <div class="group">
        <label for="outName">Save as</label>
        <input class="field" type="text" id="outName" value="combined.pdf" size="20">
      </div>
      <div class="group">
        <label>&nbsp;</label>
        <div class="btn-row">
          <button class="btn-primary" type="button" id="save">Save PDF</button>
          <button class="btn-ghost" type="button" id="saveSel">Save selection</button>
        </div>
      </div>
      <div class="group">
        <label for="splitEvery">Split every</label>
        <input class="field" type="number" id="splitEvery" value="1" min="1" max="9999" size="4">
      </div>
      <div class="group">
        <label>&nbsp;</label>
        <div class="btn-row">
          <button class="btn-ghost" type="button" id="split">Split into files</button>
        </div>
      </div>
    </div>
    <p class="sheet-note" id="saveNote"></p>
  </div>

</div>

<!-- Outside the wrap on purpose: the wrap goes `inert` while the viewer is up,
     and an inert live region is out of the accessibility tree, so anything said
     from the viewer would be said to nobody. -->
<p class="sr-only" id="say" role="status" aria-live="polite"></p>

<!-- The pile as it will be saved: one page at a time, big enough to read, and
     editable where you are reading it. The grid acts on many pages at once, the
     viewer acts on the one in front of you. -->
<div class="modal" id="viewer" role="dialog" aria-modal="true" aria-label="Page viewer" hidden>
  <div class="scrim" data-viewer-close></div>
  <div class="modal__panel" id="viewerPanel">
    <div class="modal__bar viewer-bar">
      <span class="viewer-count" id="viewerCount"></span>
      <span class="viewer-src" id="viewerSrc"></span>
      <span class="viewer-marked" id="viewerMarked"></span>
      <div class="btn-row">
        <button class="btn-ghost" type="button" id="viewerPrev" aria-label="Previous page" data-tip="← key">&#8592;</button>
        <button class="btn-ghost" type="button" id="viewerNext" aria-label="Next page" data-tip="→ key">&#8594;</button>
        <button class="btn-ghost" type="button" id="viewerClose" data-viewer-close data-tip="Esc key">Close</button>
      </div>
    </div>

    <div class="modal__body viewer-stage" id="viewerStage"></div>

    <!-- The pens. One is in hand at a time, and dragging across the page lays
         down what it draws; a mark is lifted by clicking it. Off is a pen too,
         so that reading a marked page cannot mark it by accident. -->
    <div class="modal__bar viewer-pens">
      <span class="pen-label">Pen</span>
      <div class="btn-row">
        <button class="btn-ghost pen is-on" type="button" id="penOff" aria-pressed="true" data-tip="V key">Off</button>
        <button class="btn-ghost pen" type="button" id="penBlack" aria-pressed="false" data-tip="Deletes the text under it (B key)">Blackout</button>
      </div>
      <div class="swatches" id="penTones" role="group" aria-label="Highlighters"></div>
      <span class="pen-note" id="penNote"></span>
      <button class="btn-ghost" type="button" id="markClear" data-tip="Remove this page’s marks">Clear page</button>
    </div>

    <!-- Everything here acts on the page being shown, never on the selection:
         on a surface showing one page, that is the only reading that holds. -->
    <div class="modal__bar viewer-tools">
      <button class="btn-ghost" type="button" id="viewerRotL" data-tip="[ key">&#8634; Turn left</button>
      <button class="btn-ghost" type="button" id="viewerRotR" data-tip="] key">&#8635; Turn right</button>
      <button class="btn-ghost" type="button" id="viewerEarlier" data-tip="Shift ←">Earlier</button>
      <button class="btn-ghost" type="button" id="viewerLater" data-tip="Shift →">Later</button>
      <button class="btn-ghost" type="button" id="viewerDel" data-tip="Delete key">Delete</button>
      <button class="btn-ghost viewer-mark" type="button" id="viewerSel" aria-pressed="false" data-tip="Space key">Select</button>
    </div>
  </div>
</div>

<script src="pdf-lex.js"></script>
<script src="pdf-filters.js"></script>
<script src="pdf-doc.js"></script>
<script src="pdf-write.js"></script>
<script src="pdf-ops.js"></script>
<script src="pdf-font.js"></script>
<script src="pdf-fontmap.js"></script>
<script src="pdf-render.js"></script>
<script src="pdf-image.js"></script>
<script src="pdf-marks.js"></script>
<script src="pdf-redact.js"></script>
<script src="pdf-meta.js"></script>
<script src="script.js"></script>
<script src="../assets/preprint/js/controls.js"></script>
<script src="../assets/lamp.js"></script>
<script src="../assets/share.js"></script>
<script src="../assets/favourites.js"></script>
</body>
</html>
