<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metadata Cleaner — Felix' Workshop</title>
<meta name="description" content="See and remove hidden data in photos, like GPS location.">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=5">
<script src="../assets/preprint/js/mode.js"></script>
<link rel="stylesheet" href="../assets/preprint/styles.css">
<!-- core.css, which this page skipped while base.css was standing in for it. It
     is here for the marker: .mk--citron is one of the two ink families and the
     annotated half of "printed first, then annotated". base.css follows it and
     wins every tie. -->
<link rel="stylesheet" href="../assets/preprint/core.css">
<link rel="stylesheet" href="../assets/preprint/controls.css">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <!-- The ceiling lamp, drawn in assets/site.css and swung by
       assets/lamp.js. The span is the fixture and hangs behind the page; the
       button is the switch and sits over the shade, and swings with it. The
       rose is the only part fixed to the ceiling: the flex turns under it, and
       the head — the shade and the light it throws — turns again where the flex
       ends, because a weight on a cord arrives after the cord does. -->
    <span class="lamp" aria-hidden="true">
      <span class="lamp__hang">
        <span class="lamp__flex"></span>
        <span class="lamp__head">
          <span class="lamp__beam"></span>
          <svg class="lamp__head-art" viewBox="-70 0 140 96" fill="none">
            <circle class="lamp__bulb" cx="0" cy="70" r="13"></circle>
            <g class="lamp__rig">
              <path class="lamp__shade" d="M-16 0H16L62 62H-62Z"></path>
              <path class="lamp__rim" d="M-64 62H64"></path>
            </g>
          </svg>
        </span>
      </span>
      <svg class="lamp__rose" viewBox="-30 0 60 20" fill="none">
        <path class="lamp__canopy" d="M-28 0H28V9H-28Z"></path>
        <g class="lamp__rig">
          <path class="lamp__grip" d="M-8 9H8L5 16H-5Z"></path>
        </g>
      </svg>
    </span>
    <button class="lamp-switch" type="button" data-mode-toggle aria-label="Switch colour mode"></button>

    <div>
      <a class="back-link" href="../">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" aria-hidden="true"><path d="M13.5 8h-10M7.5 4l-4 4 4 4"></path></svg>
        Felix' Workshop
      </a>
      <div class="title-row">
        <h1 class="tool-title">Metadata Cleaner</h1>
        <button class="share-btn" type="button" data-share>
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" aria-hidden="true"><path d="M9.5 4.5h3v3M12.5 4.5 9 8M6.5 11.5h-3v-3M3.5 11.5 7 8"></path></svg>
          <span data-share-label>copy link</span>
        </button>
        <button class="share-btn pin-btn" type="button" data-pin="metadata-cleaner" aria-label="Pin this tool"><span class="pin-head" aria-hidden="true"></span><span data-pin-label>pin</span></button>
      </div>
    </div>
  </header>

  <div class="spine"></div>

  <p class="lede">See and remove hidden data in photos, like GPS location.</p>

  <div class="toolbar" id="toolbar" hidden>
    <div class="group">
      <label id="presetLabel">Preset</label>
      <div class="group" id="presets" role="group" aria-labelledby="presetLabel">
        <button class="btn-ghost preset" type="button" data-preset="all">strip all</button>
        <button class="btn-ghost preset" type="button" data-preset="safe" data-tip="Keep only what viewers need to show it">safe for web</button>
        <button class="btn-ghost preset" type="button" data-preset="location" data-tip="Remove only the location">location only</button>
        <button class="btn-ghost preset" type="button" data-preset="none">keep all</button>
      </div>
    </div>

    <div class="group">
      <label class="checkbox" data-tip="Save as image-1, image-2 and so on"><input type="checkbox" id="rename"> Neutral filenames</label>
    </div>

    <div class="group">
      <button class="btn-ghost" type="button" id="reset">Clear all</button>
    </div>
  </div>

  <p class="hint" id="hint" hidden></p>

  <label class="dropzone dz-open" id="drop">
    <input type="file" id="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" multiple>
    <span class="dz-head">Drop images here</span>
    <span class="dz-pick">or choose files</span>
    <span class="dz-formats">JPEG &middot; PNG &middot; WebP</span>
    <span class="dz-note">Nothing is uploaded.</span>
  </label>

  <section id="work" hidden>
    <div class="work">

      <aside class="rail" id="rail" aria-label="Loaded files">
        <p class="section-label" id="railLabel">Files</p>
        <ul class="rail-list" id="railList"></ul>
      </aside>

      <div class="pane">
        <div class="result-bar">
          <p class="section-label" id="paneLabel">What's inside</p>
          <div class="group">
            <button class="btn-ghost" type="button" id="dlOne">Download this</button>
            <button class="btn-primary" type="button" id="dlAll">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" aria-hidden="true"><path d="M8 2.5v7.5M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11"></path></svg>
              Download all
            </button>
          </div>
        </div>

        <div id="warnings"></div>

        <div class="sheet sheet-meta">
          <div class="sheet-cap">
            <code id="capName"></code>
            <code class="meta" id="capMeta"></code>
          </div>
          <div class="sheet-scroll">
            <table id="fieldTable">
              <thead>
                <tr>
                  <th class="col-keep" scope="col"><span class="th-keep">Keep</span></th>
                  <th class="col-name" scope="col">Field</th>
                  <th class="col-value" scope="col">Value</th>
                  <th class="col-note" scope="col">Risk</th>
                </tr>
              </thead>
            </table>
          </div>
        </div>

        <p class="legend">
          <span class="tag is-marked mk--citron">identifying</span> names a person, place or camera.
          <span class="tag">telling</span> narrows it down.
        </p>

        <p class="sheet-note" id="paneNote"></p>
      </div>

    </div>
  </section>
</div>

<p class="sr-only" id="say" role="status" aria-live="polite"></p>

<script src="script.js"></script>
<script src="../assets/preprint/js/controls.js"></script>
<script src="../assets/lamp.js"></script>
<script src="../assets/share.js"></script>
<script src="../assets/favourites.js"></script>
</body>
</html>
