# The band crawler's clock — continuous until done. GitHub Actions is the
# workshop's only backend: this fires every hour with a budget just under
# the hour, so each run starts as the previous one ends and the crawl is
# effectively one unbroken pass over the eclipse band. Each run commits
# what it settled (Pages publishes it), and when the queue is empty — every
# ~80 m square valued — the workflow DISABLES ITS OWN SCHEDULE and goes
# quiet. To crawl another eclipse later: bootstrap it with
# `tools/crawl-vis.mjs --ecl <id>` (or just dispatch with that), re-enable
# the workflow, and it runs itself back to sleep again.
#
# The crawl is finite by design: the whole 2026 band is a few CPU-hours of
# real scanning plus cheap ocean sweeps — a data build for the site's
# published assets, not a resident service.
name: crawl-vis
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'crawl budget in minutes (keep under 60)'
        default: '52'
      near:
        description: 'lat,lon to prioritise (optional)'
        default: ''
permissions:
  contents: write
  actions: write
concurrency:
  group: crawl-vis
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # the DEM cache carries fetched elevation tiles between runs, so the
      # crawler stops re-downloading ground it has already read
      - uses: actions/cache@v4
        with:
          path: .dem-cache
          key: dem-cache-v1-${{ github.run_id }}
          restore-keys: dem-cache-v1-
      - run: npm install --no-save --no-package-lock pngjs@7
      - name: crawl
        run: >
          node tools/crawl-vis.mjs
          --minutes ${{ github.event.inputs.minutes || 52 }}
          ${{ github.event.inputs.near && format('--near {0}', github.event.inputs.near) || '' }}
      - name: commit what settled
        run: |
          git config user.name 'band-crawler'
          git config user.email 'noreply@github.com'
          git add eclipse-recon/data
          if git diff --cached --quiet; then echo 'nothing settled'; exit 0; fi
          git commit -F .crawl-summary.txt
          git pull --rebase origin main
          git push origin main
      - name: switch off when the band is settled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(node -e "
            const fs = require('fs');
            let n = 0;
            for (const d of fs.readdirSync('eclipse-recon/data')) {
              try {
                n += JSON.parse(fs.readFileSync(
                  'eclipse-recon/data/' + d + '/queue.json')).pending.length;
              } catch (e) {}
            }
            console.log(n);")
          echo "tiles still pending: $left"
          if [ "$left" = "0" ]; then
            gh api -X PUT \
              "repos/${{ github.repository }}/actions/workflows/crawl-vis.yml/disable"
            echo 'band settled — schedule disabled, the crawler rests'
          fi
