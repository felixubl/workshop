<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morse Key — Felix' Workshop</title>
<meta name="description" content="Tap morse code on the space bar and see it decoded.">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=5">
<script src="../assets/preprint/js/mode.js"></script>
<link rel="stylesheet" href="../assets/preprint/styles.css">
<link rel="stylesheet" href="../assets/preprint/core.css">
<link rel="stylesheet" href="../assets/preprint/controls.css">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <!-- The ceiling lamp, drawn in assets/site.css and swung by
       assets/lamp.js. The span is the fixture and hangs behind the page; the
       button is the switch and sits over the shade, and swings with it. The
       rose is the only part fixed to the ceiling: the flex turns under it, and
       the head — the shade and the light it throws — turns again where the flex
       ends, because a weight on a cord arrives after the cord does. -->
    <span class="lamp" aria-hidden="true">
      <span class="lamp__hang">
        <span class="lamp__flex"></span>
        <span class="lamp__head">
          <span class="lamp__beam"></span>
          <svg class="lamp__head-art" viewBox="-70 0 140 96" fill="none">
            <circle class="lamp__bulb" cx="0" cy="70" r="13"></circle>
            <g class="lamp__rig">
              <path class="lamp__shade" d="M-16 0H16L62 62H-62Z"></path>
              <path class="lamp__rim" d="M-64 62H64"></path>
            </g>
          </svg>
        </span>
      </span>
      <svg class="lamp__rose" viewBox="-30 0 60 20" fill="none">
        <path class="lamp__canopy" d="M-28 0H28V9H-28Z"></path>
        <g class="lamp__rig">
          <path class="lamp__grip" d="M-8 9H8L5 16H-5Z"></path>
        </g>
      </svg>
    </span>
    <button class="lamp-switch" type="button" data-mode-toggle aria-label="Switch colour mode"></button>

    <div>
      <a class="back-link" href="../">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" aria-hidden="true"><path d="M13.5 8h-10M7.5 4l-4 4 4 4"></path></svg>
        Felix' Workshop
      </a>
      <div class="title-row">
        <h1 class="tool-title">Morse Key</h1>
        <button class="share-btn" type="button" data-share>
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="square" aria-hidden="true"><path d="M9.5 4.5h3v3M12.5 4.5 9 8M6.5 11.5h-3v-3M3.5 11.5 7 8"></path></svg>
          <span data-share-label>copy link</span>
        </button>
        <button class="share-btn pin-btn" type="button" data-pin="morse-key" aria-label="Pin this tool"><span class="pin-head" aria-hidden="true"></span><span data-pin-label>pin</span></button>
      </div>
    </div>
  </header>

  <div class="spine"></div>

  <p class="lede">Tap morse code on the space bar and see it decoded.</p>

  <div class="toolbar">
    <div class="group">
      <label for="wpm">Speed</label>
      <input class="field" type="number" id="wpm" min="5" max="40" step="1" value="12" aria-label="Speed in words per minute" data-tip="Words per minute">
      <span class="tag readout" id="unitOut">dit 100 ms</span>
    </div>

    <div class="group">
      <label for="spacing">Spacing</label>
      <input class="field" type="number" id="spacing" min="3" max="40" step="1" value="5" aria-label="Gap speed in words per minute" data-tip="Gap speed in words per minute. Lower allows longer pauses">
      <span class="tag readout" id="gapOut">letter 410 · word 1200 ms</span>
    </div>

    <div class="group">
      <label>Your speed</label>
      <span class="tag readout" id="fistOut">—</span>
      <button class="btn-ghost preset" type="button" id="match" disabled data-tip="Set both dials to your speed">match</button>
    </div>

    <div class="group">
      <label for="pitch">Tone</label>
      <input class="field" type="number" id="pitch" min="300" max="1200" step="20" value="600" aria-label="Pitch in hertz" data-tip="Pitch in hertz">
      <label class="checkbox"><input type="checkbox" id="sound" checked> Sound</label>
    </div>

    <div class="group">
      <button class="btn-ghost" type="button" id="copy">copy text</button>
      <button class="btn-ghost" type="button" id="clear">clear</button>
    </div>
  </div>

  <div class="deck">
    <!-- A button, so it is reachable and pressable without a pointer. Press and
       release are driven from pointer and key events rather than from click,
       because a click has no duration and duration is the entire signal. -->
    <button class="key-slab" type="button" id="slab" aria-label="Morse key. Hold to send">
      <span class="key-cap">space</span>
      <span class="key-say">tap for a dit, hold for a dah</span>
    </button>

    <div class="deck-side">
      <div class="result-bar">
        <p class="section-label">Keying</p>
        <code id="liveSay">nothing yet</code>
      </div>
      <code class="live-code" id="liveCode" aria-live="off"></code>
    </div>
  </div>
  <p class="sheet-note">Backspace deletes the last letter.</p>

  <div class="result-bar">
    <p class="section-label">Paper tape</p>
    <code id="tapeLegend">60 units</code>
  </div>
  <canvas class="tape" id="tape" aria-hidden="true"></canvas>

  <div class="result-bar">
    <p class="section-label">Message</p>
    <code id="count">0 characters</code>
  </div>
  <div class="line" id="line" aria-live="polite"><span class="caret" aria-hidden="true"></span></div>

  <div class="result-bar">
    <p class="section-label">Alphabet</p>
    <code id="chartSay">56 characters</code>
  </div>
  <div class="chart" id="chart"></div>
</div>

<!-- The code, the thresholds and the key are shared with Morse Speed Test,
   which loads this same file rather than keeping a copy of it. -->
<script src="morse.js"></script>
<script src="script.js"></script>
<script src="../assets/preprint/js/controls.js"></script>
<script src="../assets/lamp.js"></script>
<script src="../assets/share.js"></script>
<script src="../assets/favourites.js"></script>
</body>
</html>
